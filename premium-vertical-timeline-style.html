<!-- Premium Interactive Vertical Timeline - Our Method Section CSS -->
<style>
    /* ==========================================================================
       Premium Interactive Vertical Timeline - Our Method Section
       ========================================================================== */

    /* 1. Section Background & Atmosphere */
    .gb-method {
        background: linear-gradient(180deg, #0B1020 0%, #0D1321 100%);
        padding: 100px 0 80px;
        position: relative;
        overflow: hidden;
        color: #ffffff;
    }

    .gb-method::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
            radial-gradient(circle at 10% 20%, rgba(255, 112, 72, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(255, 112, 72, 0.05) 0%, transparent 40%);
        pointer-events: none;
    }

    .gb-method__wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        position: relative;
        z-index: 2;
    }

    /* 2. Section Header */
    .gb-method__head {
        text-align: center;
        max-width: 700px;
        margin: 0 auto 80px;
        position: relative;
        z-index: 2;
    }

    .gb-method__eyebrow {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #FF7048;
        margin-bottom: 16px;
        position: relative;
        padding-bottom: 12px;
    }

    .gb-method__eyebrow::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 2px;
        background: #FF7048;
    }

    .gb-method__title {
        font-size: 36px;
        font-weight: 800;
        line-height: 1.2;
        color: #F5F6FA;
        margin: 0 0 16px;
        letter-spacing: -0.5px;
    }

    .gb-method__title .highlight {
        color: #FF7048;
        background: linear-gradient(90deg, #FF7048, #FF8A65);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .gb-method__sub {
        color: #A5AEC0;
        font-size: 16px;
        line-height: 1.7;
        margin: 0;
        font-weight: 400;
    }

    /* 3. Timeline Container */
    .gb-method__timeline {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding: 40px 0;
    }

    /* Central Timeline Line */
    .gb-method__line {
        position: absolute;
        left: 50%;
        top: 40px;
        bottom: 40px;
        width: 2px;
        background: linear-gradient(180deg, transparent 0%, rgba(255, 112, 72, 0.3) 10%, rgba(255, 112, 72, 0.5) 50%, rgba(255, 112, 72, 0.3) 90%, transparent 100%);
        transform: translateX(-50%);
        z-index: 0;
    }

    .gb-method__line::before {
        content: '';
        position: absolute;
        top: 0;
        left: -2px;
        width: 6px;
        height: 6px;
        background: #FF7048;
        border-radius: 50%;
        box-shadow: 0 0 10px #FF7048, 0 0 20px rgba(255, 112, 72, 0.5);
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* 4. Timeline Card Container */
    .gb-method__stage {
        display: flex;
        align-items: center;
        gap: 40px;
        position: relative;
        z-index: 1;
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gb-method__stage.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* Card Styles */
    .gb-method__card {
        flex: 1;
        background: rgba(21, 29, 50, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 28px;
        backdrop-filter: blur(10px);
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
    }

    .gb-method__card:hover {
        transform: translateY(-5px);
        border-color: rgba(255, 112, 72, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .gb-method__card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #FF7048, transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .gb-method__card:hover::before {
        opacity: 1;
    }

    /* Card Image */
    .gb-method__card-img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 20px;
        transition: transform 0.4s ease;
        background: linear-gradient(135deg, #1e293b, #334155);
    }

    .gb-method__card:hover .gb-method__card-img {
        transform: scale(1.05);
    }

    /* Card Content */
    .gb-method__stage-number {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #FF7048;
        margin-bottom: 8px;
        display: block;
    }

    .gb-method__card-title {
        font-size: 18px;
        font-weight: 700;
        color: #F5F6FA;
        margin: 0 0 12px;
        line-height: 1.3;
    }

    .gb-method__card-desc {
        color: #A5AEC0;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
        font-weight: 400;
    }

    /* 5. Stage Indicators on Timeline */
    .gb-method__indicator {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #1a2333;
        border: 3px solid rgba(255, 255, 255, 0.2);
        position: relative;
        flex-shrink: 0;
        z-index: 2;
        transition: all 0.4s ease;
    }

    .gb-method__stage:nth-child(odd) .gb-method__indicator {
        margin-right: -40px;
    }

    .gb-method__stage:nth-child(even) .gb-method__indicator {
        margin-left: -40px;
    }

    .gb-method__indicator.active {
        background: #FF7048;
        border-color: #FF7048;
        box-shadow: 0 0 20px rgba(255, 112, 72, 0.6), 0 0 40px rgba(255, 112, 72, 0.4);
        transform: scale(1.3);
    }

    .gb-method__indicator.active::after {
        content: '';
        position: absolute;
        top: -6px;
        left: -6px;
        right: -6px;
        bottom: -6px;
        border-radius: 50%;
        border: 2px solid rgba(255, 112, 72, 0.5);
        animation: indicatorPulse 2s ease-in-out infinite;
    }

    @keyframes indicatorPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.4); opacity: 0; }
    }

    /* 6. Connector Lines */
    .gb-method__connector {
        position: absolute;
        left: 50%;
        width: 2px;
        height: 40px;
        background: linear-gradient(180deg, transparent 0%, rgba(255, 112, 72, 0.3) 50%, transparent 100%);
        transform: translateX(-50%);
        z-index: 0;
    }

    .gb-method__stage:nth-child(odd) .gb-method__connector {
        right: 50%;
    }

    .gb-method__stage:nth-child(even) .gb-method__connector {
        left: 50%;
    }

    /* 7. CTA Section */
    .gb-method__cta {
        text-align: center;
        margin-top: 60px;
        padding-top: 40px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
    }

    .gb-method__cta-text {
        color: #F5F6FA;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 24px;
    }

    .gb-method__cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 32px;
        background: linear-gradient(135deg, #FF7048 0%, #FF8A65 100%);
        color: #ffffff;
        border: none;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(255, 112, 72, 0.3);
    }

    .gb-method__cta-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(255, 112, 72, 0.4);
    }

    .gb-method__cta-btn i {
        transition: transform 0.3s ease;
    }

    .gb-method__cta-btn:hover i {
        transform: translateX(5px);
    }

    /* 8. Responsive Design */
    @media (max-width: 991px) {
        .gb-method {
            padding: 80px 0 60px;
        }

        .gb-method__head {
            margin-bottom: 60px;
        }

        .gb-method__title {
            font-size: 32px;
        }

        .gb-method__stage {
            flex-direction: column;
            gap: 20px;
        }

        .gb-method__indicator {
            margin: 0;
        }

        .gb-method__connector {
            display: none;
        }

        .gb-method__line {
            left: 30px;
        }

        .gb-method__card {
            margin-left: 30px;
        }

        .gb-method__card-img {
            height: 120px;
        }
    }

    @media (max-width: 575px) {
        .gb-method {
            padding: 60px 0 40px;
        }

        .gb-method__wrap {
            padding: 0 16px;
        }

        .gb-method__title {
            font-size: 26px;
        }

        .gb-method__sub {
            font-size: 14px;
        }

        .gb-method__stage {
            gap: 16px;
        }

        .gb-method__card {
            padding: 20px;
        }

        .gb-method__card-img {
            height: 100px;
        }

        .gb-method__cta-text {
            font-size: 16px;
        }

        .gb-method__cta-btn {
            padding: 12px 24px;
            font-size: 14px;
        }
    }

    /* 9. Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
        .gb-method__stage,
        .gb-method__card,
        .gb-method__indicator,
        .gb-method__cta-btn {
            transition: none !important;
            animation: none !important;
            transform: none !important;
            opacity: 1 !important;
        }

        .gb-method__indicator.active {
            background: #FF7048;
            border-color: #FF7048;
        }

        .gb-method__line::before {
            animation: none;
        }
    }
</style>
